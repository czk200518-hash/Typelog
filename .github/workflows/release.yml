# 发布工作流：tag 推送时在 CI 中构建插件并发布，同时生成构建来源证明（artifact attestations）
# 构建产物直接来自源码，确保与评审系统重新构建的结果一致。
name: Release plugin

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Generate build provenance attestations
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            main.js
            styles.css
            manifest.json

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            main.js
            styles.css
            manifest.json
          generate_release_notes: true
